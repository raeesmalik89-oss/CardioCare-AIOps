
name: CardioCare-AIOps CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install flake8
      - run: |
          flake8 services/producer/producer.py --max-line-length=120 --ignore=E501,W503,W504,E1,E2,E302,F401
          flake8 services/aiops-engine/detector.py --max-line-length=120 --ignore=E501,W503,W504,E1,E2,E302,F401
          flake8 services/alert-function/handler.py --max-line-length=120 --ignore=E501,W503,W504,E1,E2,E302,F401
          flake8 services/api/main.py --max-line-length=120 --ignore=E501,W503,W504,E1,E2,E302,F401

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r services/api/requirements.txt pytest
      - run: pytest -q

  zap-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r services/api/requirements.txt
      - name: Start API for security scan
        working-directory: services/api
        env:
          ENABLE_API_KAFKA_CONSUMER: "false"
          ENABLE_TRACING: "false"
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 10
          curl --fail http://127.0.0.1:8000/health
      - name: OWASP ZAP baseline scan
        run: |
          mkdir -p zap-out
          cp .zap/rules.tsv zap-out/rules.tsv
          chmod -R 777 zap-out
          docker run --rm --network host \
            -v "${{ github.workspace }}/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://127.0.0.1:8000 \
              -c rules.tsv -a -j \
              -r zap-report.html -w zap-report.md -J zap-report.json \
            || echo "ZAP reported findings (non-blocking); see uploaded report."
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: zap-out/
          if-no-files-found: warn

  encryption-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install cryptography
      - name: Test application event encryption
        env:
          EVENT_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          PYTHONPATH: services/aiops-engine
        run: |
          python3 -c "
          from crypto import encrypt_event, decrypt_event
          event = {'patient_id': 'TEST', 'vitals': {'heart_rate': 80}}
          encrypted = encrypt_event(event)
          assert b'patient_id' not in encrypted
          assert decrypt_event(encrypted) == event
          print('Application AES-256-GCM round trip PASSED')
          "

  docker-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
        env:
          KAFKA_BOOTSTRAP_SERVERS: kafka:29092
          SECRET_KEY: test-secret-key-for-ci
          GRAFANA_PASSWORD: test-grafana-password
          KEYCLOAK_ADMIN_PASSWORD: test-keycloak-password
          EVENT_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

  docker-push:
    runs-on: ubuntu-latest
    needs: [lint, test, zap-baseline, encryption-test, docker-validate]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push producer
        uses: docker/build-push-action@v5
        with:
          context: services/producer
          push: true
          tags: mraees1989/cardiocare-producer:latest,mraees1989/cardiocare-producer:v1.1
      - name: Build and push aiops-engine
        uses: docker/build-push-action@v5
        with:
          context: services/aiops-engine
          push: true
          tags: mraees1989/cardiocare-aiops-engine:latest,mraees1989/cardiocare-aiops-engine:v1.1
      - name: Build and push alert-function
        uses: docker/build-push-action@v5
        with:
          context: services/alert-function
          push: true
          tags: mraees1989/cardiocare-alert-function:latest,mraees1989/cardiocare-alert-function:v1.1
      - name: Build and push api
        uses: docker/build-push-action@v5
        with:
          context: services/api
          push: true
          tags: mraees1989/cardiocare-api:latest,mraees1989/cardiocare-api:v1.1
      - name: Build and push OpenFaaS alert function
        uses: docker/build-push-action@v5
        with:
          context: .
          file: openfaas/Dockerfile
          push: true
          tags: mraees1989/cardiocare-alert-function:openfaas

